<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Fun!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Let's Interact!</h1>

        <div class="section">
            <h2>1. Event Handling 🎈</h2>
            <button id="clickButton">Click Me!</button>
            <div id="hoverArea">Hover Over Me</div>
            <input type="text" id="keypressInput" placeholder="Type Something">
            <p id="keypressOutput"></p>
            <button id="secretButton">Double Click/Long Press for Secret</button>
            <p id="secretAction" class="hidden">🤫 Secret Action Triggered!</p>
        </div>

        <div class="section">
            <h2>2. Interactive Elements 🎮</h2>
            <button id="changeTextButton">Change Text</button>
            <p id="changingText">Initial Text</p>

            <div class="image-gallery">
                <img src="https://via.placeholder.com/150/FFC0CB/FFFFFF?Text=Image%201" alt="Image 1" class="active">
                <img src="https://via.placeholder.com/150/ADD8E6/FFFFFF?Text=Image%202" alt="Image 2">
                <img src="https://via.placeholder.com/150/90EE90/FFFFFF?Text=Image%203" alt="Image 3">
                <div class="gallery-nav">
                    <button id="prevImage">Previous</button>
                    <button id="nextImage">Next</button>
                </div>
            </div>

            <div class="tabs">
                <div class="tab-buttons">
                    <button class="tab-button active" data-tab="tab1">Tab 1</button>
                    <button class="tab-button" data-tab="tab2">Tab 2</button>
                    <button class="tab-button" data-tab="tab3">Tab 3</button>
                </div>
                <div class="tab-contents">
                    <div id="tab1" class="tab-content active">Content for Tab 1</div>
                    <div id="tab2" class="tab-content">Content for Tab 2</div>
                    <div id="tab3" class="tab-content">Content for Tab 3</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>3. Form Validation 📋✅</h2>
            <form id="myForm">
                <div>
                    <label for="name">Name (required):</label>
                    <input type="text" id="name" required>
                    <p class="error-message" id="nameError"></p>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                    <p class="error-message" id="emailError"></p>
                </div>
                <div>
                    <label for="password">Password (min 8 characters):</label>
                    <input type="password" id="password">
                    <p class="error-message" id="passwordError"></p>
                </div>
                <button type="submit">Submit</button>
                <p id="formMessage" class="hidden"></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
